<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="container">
  <h2>Регистрация</h2>
  <form id="register-form">
    <input type="email" name="email" id="email" placeholder="Email" required>
    <input type="text" name="firstName" id="firstName" placeholder="Имя" required>
    <input type="text" name="lastName" id="lastName" placeholder="Фамилия" required>
    <input type="password" name="password" id="password" placeholder="Пароль" required>
    <input type="password" name="passwordConfirm" id="passwordConfirm" placeholder="Пароль ещё раз" required>
    <button type="submit">Зарегистрироваться</button>
  </form>

  <script>
    document.getElementById("register-form").addEventListener("submit", async function (e) {
      e.preventDefault();

      const data = {
        email: document.getElementById("email").value,
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        password: document.getElementById("password").value,
        passwordConfirm: document.getElementById("passwordConfirm").value
      };

      const response = await fetch("/users/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });

      if (response.ok) {
        alert("Регистрация прошла успешно");
        window.location.href = "/login";
      } else {
        const error = await response.json();
        alert("Ошибка: " + error.message);
      }
    });
  </script>

</div>
</body>
</html>
